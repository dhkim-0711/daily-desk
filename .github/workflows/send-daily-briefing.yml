name: Prepare daily briefing for GPT

on:
  push:
    branches: [main]
    paths:
      - 'briefings/ready/*.json'
      - 'mail/**'
      - '.github/workflows/send-daily-briefing.yml'
  schedule:
    # UTC 00:35-14:35 = 09:35-23:35 KST. Ready commits also trigger immediately.
    - cron: '35 0-14 * * *'
    # Independent read-only watchdog: 11:05-23:05 KST.
    - cron: '5 2-14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prepare and publish for GPT, or render a local review artifact'
        type: choice
        options: [prepare, dry-run]
        default: prepare
      date:
        description: 'Optional YYYY-MM-DD; historical dates only in dry-run'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: daily-briefing-render
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event.schedule != '5 2-14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_MODE: ${{ inputs.mode || 'prepare' }}
      INPUT_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer dependencies
        run: python -m pip install -r mail/requirements.txt
      - name: Run rendering and delivery safeguards tests
        run: |
          python -m unittest discover -s mail/tests -p 'test_*.py'
          node --test mail/tests/test_sender.cjs
          npm test
      - name: Check current briefing readiness
        id: gate
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          if os.environ['INPUT_MODE'] == 'dry-run':
              result = {'status': 'manual_review'}
              proceed = True
          else:
              cmd = [sys.executable, 'mail/prepare.py', '--preflight']
              if os.environ.get('INPUT_DATE'): cmd += ['--date', os.environ['INPUT_DATE']]
              completed = subprocess.run(cmd, capture_output=True, text=True)
              print(completed.stdout)
              print(completed.stderr, file=sys.stderr)
              if completed.returncode:
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write('Preparation gate failed. See the fixed error code in this step.\n')
                  sys.exit(completed.returncode)
              result = json.loads(completed.stdout)
              proceed = result['status'] == 'ready'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'proceed={str(proceed).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## Daily Desk preparation\nReadiness: **{result['status']}**\n")
              f.write('GitHub prepares HTML/PDF only. GPT uses the connected Gmail account to send.\n')
          PY
      - name: Install PDF fonts and layout dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
      - name: Render fixed design and publish MIME bundle
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import os, subprocess, sys
          cmd = [sys.executable, 'mail/prepare.py', '--output-dir', 'mail/output']
          cmd += ['--dry-run' if os.environ['INPUT_MODE'] == 'dry-run' else '--publish']
          if os.environ.get('INPUT_DATE'): cmd += ['--date', os.environ['INPUT_DATE']]
          completed = subprocess.run(cmd, capture_output=True, text=True)
          print(completed.stdout)
          print(completed.stderr, file=sys.stderr)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```\n' + completed.stdout + completed.stderr + '\n```\n')
          sys.exit(completed.returncode)
          PY
      - name: Retain generated files for review
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-render-${{ github.run_id }}
          path: mail/output/
          if-no-files-found: ignore
          retention-days: 14
      - name: Make unsuccessful preparation visible
        if: failure()
        run: |
          echo '::error::Daily Desk preparation failed. A later scheduled run will retry; GPT must send only a verified rendered bundle.'
          echo 'Preparation failed; no email was sent by GitHub.' >> "$GITHUB_STEP_SUMMARY"
  watch-delivery:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || github.event.schedule == '5 2-14 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify today's durable delivery evidence
        run: python mail/check_delivery.py
