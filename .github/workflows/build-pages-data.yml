name: Build dashboard data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/rebuild-news-archive.js"
      - "scripts/build-static-data.js"
      - "scripts/patch-archive-ui.js"
      - "scripts/patch-archive-month-selector.js"
      - "scripts/should-refresh-data.js"
      - ".github/workflows/build-pages-data.yml"
  schedule:
    # Primary refresh slots: 07:10, 10:10, 13:10, 16:10, 19:10, 22:10 KST.
    - cron: "10 22,1,4,7,10,13 * * *"
    # Recovery slots run 15 minutes later only when the latest snapshot is stale.
    - cron: "25 22,1,4,7,10,13 * * *"

permissions:
  contents: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decide whether data refresh is needed
        id: freshness
        run: node scripts/should-refresh-data.js "${{ github.event.schedule }}"
      - name: Recover historical news archive
        if: steps.freshness.outputs.should_refresh == 'true'
        run: |
          if [ ! -f docs/data/archive/index.json ]; then
            node scripts/rebuild-news-archive.js
          else
            echo "Historical archive already exists; skipping one-time recovery."
          fi
      - name: Patch archive-aware UI
        if: steps.freshness.outputs.should_refresh == 'true'
        run: node scripts/patch-archive-ui.js
      - name: Keep month selector within collection period
        if: steps.freshness.outputs.should_refresh == 'true'
        run: node scripts/patch-archive-month-selector.js
      - name: Build dashboard data
        if: steps.freshness.outputs.should_refresh == 'true'
        run: npm run build:data
      - name: Commit refreshed data
        if: steps.freshness.outputs.should_refresh == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh dashboard data"
          file_pattern: "public/data-snapshot.js public/data/dashboard.json public/data/archive/*.json docs/data-snapshot.js docs/data/dashboard.json docs/data/archive/*.json public/app.js docs/app.js"
